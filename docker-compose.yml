services:
  pipeline:
    build: .
    command: merchmind run --transactions 25000 --customers 1500 --products 350
    volumes:
      - merchmind-data:/app/data

  api:
    build: .
    command: uvicorn merchmind.api:app --host 0.0.0.0 --port 8000
    depends_on:
      pipeline:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - merchmind-data:/app/data:ro

  dashboard:
    build: .
    command: streamlit run src/merchmind/dashboard.py --server.address 0.0.0.0
    depends_on:
      pipeline:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    volumes:
      - merchmind-data:/app/data:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merchmind
      POSTGRES_USER: merchmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merchmind}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchmind -d merchmind"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  warehouse:
    build: .
    command: python -m merchmind.warehouse --dsn postgresql://merchmind:${POSTGRES_PASSWORD:-merchmind}@postgres:5432/merchmind
    depends_on:
      pipeline:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - merchmind-data:/app/data:ro

  kafka:
    image: redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:29092,external://127.0.0.1:9092
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - kafka-data:/var/lib/redpanda/data

  kafka-init:
    image: redpandadata/redpanda:v24.3.5
    profiles: [streaming]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - >-
        rpk topic describe retail-transactions -X brokers=kafka:29092 >/dev/null 2>&1 ||
        rpk topic create retail-transactions --partitions 3 --replicas 1 -X brokers=kafka:29092

  replay:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: [streaming]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      pipeline:
        condition: service_completed_successfully
    command: [python3, -m, merchmind.streaming, --bootstrap-servers, "kafka:29092", --events-per-second, "0"]
    volumes:
      - merchmind-data:/app/data:ro

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: [streaming]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - python3
      - scripts/run_stream.py
      - --bootstrap-servers
      - kafka:29092
      - --output
      - /app/stream-data/output
      - --checkpoint
      - /app/stream-data/checkpoints
    volumes:
      - stream-data:/app/stream-data
      - spark-ivy:/tmp/merchmind-ivy

  refresh:
    build: .
    profiles: [streaming]
    depends_on:
      pipeline:
        condition: service_completed_successfully
    command: [python, -m, merchmind.live, --raw-dir, /app/stream-data/output/raw, --watch]
    restart: on-failure
    volumes:
      - merchmind-data:/app/data
      - stream-data:/app/stream-data:ro

  streaming-test:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: [streaming]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MERCHMIND_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RUN_KAFKA_INTEGRATION: "1"
      STREAMING_EVIDENCE_DIR: /app/evidence
    command: [python3, -m, pytest, tests/integration, --no-cov, -v, -s]
    volumes:
      - spark-ivy:/tmp/merchmind-ivy
      - ./data/streaming-evidence:/app/evidence

volumes:
  merchmind-data:
  postgres-data:
  kafka-data:
  stream-data:
  spark-ivy:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate the complete retail stack configuration
        run: make compose-check
      - name: Execute daily close DAG and late-event rerun
        run: |
          mkdir -p data/airflow-evidence
          chmod 777 data/airflow-evidence
          make airflow-test
      - name: Upload Airflow execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-evidence
          path: data/airflow-evidence

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: merchmind
          POSTGRES_USER: merchmind
          POSTGRES_PASSWORD: merchmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchmind -d merchmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[dev,warehouse]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Exercise pipeline
        run: merchmind run --data-dir /tmp/merchmind-ci --transactions 5000 --customers 400 --products 120
      - name: Load PostgreSQL warehouse and build analytical views
        env:
          MERCHMIND_POSTGRES_DSN: postgresql://merchmind:merchmind@localhost:5432/merchmind
        run: python -m merchmind.warehouse --data-dir /tmp/merchmind-ci

  streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: merchmind-streaming-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Kafka delivery, Spark aggregates and checkpoint recovery
        run: |
          # Keep the bind-mount parent owned by the runner so it can write broker.log.
          mkdir -p data/streaming-evidence
          docker compose --profile streaming run -T --build --rm streaming-test
      - name: Capture broker logs
        if: always()
        run: |
          mkdir -p data/streaming-evidence
          docker compose logs kafka > data/streaming-evidence/broker.log 2>&1
      - name: Upload streaming execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-evidence
          path: |
            data/streaming-evidence/**/*.json
            data/streaming-evidence/**/*.log
      - name: Stop the isolated test stack
        if: always()
        run: docker compose --profile streaming down --volumes

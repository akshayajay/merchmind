[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merchmind"
version = "0.1.0"
description = "Cloud-native fashion retail market intelligence and merchandising analytics platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshaya Jayakanth" }]
keywords = ["fashion", "retail", "data-engineering", "analytics", "aws", "spark", "kafka"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "plotly>=5.24,<7",
  "pyarrow>=16,<26",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]
streaming = [
  "confluent-kafka>=2.6,<4",
]
spark = [
  "pyspark==4.0.1",
]
cloud = [
  "boto3>=1.35,<2",
]
warehouse = [
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
merchmind = "merchmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=merchmind --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = ["integration: requires a live Kafka broker and Spark 4.0.1"]

[tool.coverage.run]
omit = [
  "*/__main__.py",
  "*/cli.py",
  "*/dashboard.py",
  "*/warehouse.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
